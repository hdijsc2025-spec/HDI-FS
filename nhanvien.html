<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#584A00">
<title>HDI - Cổng Nhân Viên</title>
<style>
  html, body { height: 100%; margin: 0; background: #584A00; font-family: Arial, Helvetica, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #dang { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #fff; font-size: 15px; text-align: center; padding: 20px; }
  #dang a { color: #E2B922; display: none; }
</style>
</head>
<body>
<div id="dang"><div id="dangTxt">Đang tải cổng nhân viên...</div><a id="moTab" target="_blank" rel="noopener">Tải chậm? Mở trong tab mới</a></div>
<iframe id="khung" title="Cổng nhân viên" allow="geolocation; clipboard-write" style="visibility:hidden"></iframe>
<noscript><p style="color:#fff;padding:16px">Trang cần bật JavaScript để hiển thị.</p></noscript>
<script>
// ===== CHỈ SỬA 1 DÒNG NÀY khi đổi link triển khai Apps Script (link /exec của cổng nhân viên) =====
var EXEC_URL = 'https://script.google.com/macros/s/THAY_BANG_LINK_EXEC/exec';
// =================================================================================================
(function () {
  var khung = document.getElementById('khung'), dang = document.getElementById('dang'), mo = document.getElementById('moTab');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(EXEC_URL) || EXEC_URL.indexOf('THAY_BANG') !== -1) {
    document.getElementById('dangTxt').textContent = 'Chưa cấu hình đường dẫn Apps Script (EXEC_URL).'; return;
  }
  mo.href = EXEC_URL;
  khung.onload = function () { khung.style.visibility = 'visible'; dang.style.display = 'none'; };
  setTimeout(function () { mo.style.display = 'block'; }, 8000);
  khung.src = EXEC_URL;
})();
</script>
</body>
</html>
