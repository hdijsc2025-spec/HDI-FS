<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Cho phép zoom 2 ngón tay, tối ưu viền màn hình -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>HDI Financial System — Just Do It</title>
    <style>
        :root {
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }

        /* Nền trang ngoài */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
            background-color: #1e293b; /* Màu nền tối bên ngoài viền 95% */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Khung chứa tổng (Chỉ chiếm đúng 95% chiều cao & 95% chiều rộng màn hình) */
        .app-card {
            width: 95vw;
            height: 95vh;
            background-color: #ffffff;
            border-radius: 12px; /* Bo góc nhẹ cho đẹp */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Thanh tiêu đề hệ thống */
        .header-banner {
            width: 100%;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #ffffff;
            text-align: center;
            padding: 12px 10px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        /* Khung chứa iframe chiếm phần diện tích còn lại trong 95% */
        .iframe-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            -webkit-overflow-scrolling: touch;
            overflow: auto;
            touch-action: auto; 
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        @media (max-width: 480px) {
            .header-banner {
                font-size: 13px;
                padding: 10px 5px;
            }
        }
    </style>
</head>
<body>

    <!-- Khung bao 95% màn hình -->
    <div class="app-card">
        <!-- Tiêu đề hệ thống -->
        <div class="header-banner">
            HDI Financial System — Just Do It
        </div>

        <!-- Khung chứa ứng dụng Web App -->
        <div class="iframe-container" id="app-wrapper">
            <!-- Iframe được khởi tạo bằng JS -->
        </div>
    </div>

    <script>
        const _0x1a2b = "aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J3Vy1SeF9LZlVzd0RKOGFMN2NoY0dOa0p6bGVIRTl5S1ZwcFNIbTRPUTZodlRrNlhVUGFTbDNNQW80cWRHY2Uwbl8vZXhlYw==";

        window.addEventListener('DOMContentLoaded', () => {
            const frame = document.createElement('iframe');
            frame.src = atob(_0x1a2b);
            
            // Cho phép hiển thị thanh cuộn và nhận thao tác Zoom
            frame.setAttribute('scrolling', 'yes');
            frame.style.touchAction = 'auto';
            
            document.getElementById('app-wrapper').appendChild(frame);
        });

        // Chặn menu chuột phải
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Chặn phím tắt F12 & DevTools
        document.addEventListener('keydown', e => {
            if (
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key)) ||
                (e.ctrlKey && ['U', 'u', 'S', 's'].includes(e.key))
            ) {
                e.preventDefault();
                e.stopPropagation();
            }
        });
    </script>
</body>
</html>
